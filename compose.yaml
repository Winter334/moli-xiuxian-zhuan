name: moli-local
services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: moli_admin
      POSTGRES_PASSWORD: moli_admin_local_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - moli_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moli_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  moli_pgdata:
